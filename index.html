<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>카쿰 정산기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
/* Layout idea: sticky ledger header with live totals, tabbed work area, yellow input cells like the paper sheet. */
:root{
  --bg:#f1f3ef;
  --surface:#ffffff;
  --ink:#1b2a2e;
  --muted:#5b6b6f;
  --line:#d7dfda;
  --accent:#1c6a65;
  --accent-ink:#ffffff;
  --cell:#fff4c2;
  --warn:#9a5a0c;
  --bad:#b0332a;
  --good:#2a7842;
  --font-body:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-display:"Black Han Sans","IBM Plex Sans KR","Noto Sans KR",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1617; --surface:#162123; --ink:#e4ece9; --muted:#93a6a4; --line:#2a3a3b;
    --accent:#5cc2b5; --accent-ink:#0b1415; --cell:#3a3418; --warn:#e0a24d; --bad:#ef7d72; --good:#6cc487;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1617; --surface:#162123; --ink:#e4ece9; --muted:#93a6a4; --line:#2a3a3b;
  --accent:#5cc2b5; --accent-ink:#0b1415; --cell:#3a3418; --warn:#e0a24d; --bad:#ef7d72; --good:#6cc487;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
.mgrtop{display:flex;align-items:center;gap:6px;font-weight:700;font-size:13px}
.mgrtop .in{width:110px;background:var(--surface);border:1px solid var(--line);font-weight:700}
.in.trt{font-weight:800;text-align:center;min-width:64px;font-size:15px}
.in.trt.t1{color:var(--accent);border-color:var(--accent)}
.in.trt.t2{color:var(--warn);border-color:var(--warn)}
tr.rt2 td:first-child{box-shadow:inset 3px 0 var(--warn)}
tr.rt1 td:first-child{box-shadow:inset 3px 0 var(--accent)}
header.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:12px}
h1{font-family:var(--font-display);font-weight:400;font-size:26px;margin:0;letter-spacing:.01em;text-wrap:balance}
h1 small{font-family:var(--font-body);font-size:13px;color:var(--muted);margin-left:8px;font-weight:500}
.weekbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:8px;cursor:pointer;min-height:36px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.danger{color:var(--bad)}
.btn.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{padding:3px 9px;min-height:28px;font-size:13px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.tile span{display:block;font-size:12px;color:var(--muted)}
.tile b{display:block;font-size:19px;font-weight:700;margin-top:2px;word-break:keep-all}
.tile.key{border-color:var(--accent)}
.notes{display:flex;flex-direction:column;gap:4px;margin-bottom:8px}
.note{font-size:13px;color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,transparent);border-radius:8px;padding:6px 10px}
.note.info{color:var(--muted);background:color-mix(in srgb,var(--muted) 10%,transparent)}
nav.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;margin-bottom:14px}
nav.tabs button{border:0;background:transparent;padding:10px 14px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;color:var(--muted);font-weight:500}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.panel + .panel{margin-top:12px}
h2{font-size:16px;margin:0 0 4px}
p.hint{margin:0 0 10px;color:var(--muted);font-size:13px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:4px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600;background:transparent}
td.r,th.r{text-align:right}
td.c,th.c{text-align:center}
tr.off td{opacity:.5}
tfoot td{font-weight:700;border-bottom:0}
.in{width:100%;background:var(--cell);border:1px solid transparent;border-radius:6px;padding:5px 7px;min-height:32px}
.in:focus{border-color:var(--accent);outline:none}
.in.num{text-align:right;min-width:88px}
.in.pct{min-width:60px;width:70px}
.in.unit{min-width:118px}
.in.w-item{min-width:170px}
.in.sel{min-width:104px;width:auto;cursor:pointer}
.in.sel.trt{min-width:72px}
td.nt{width:99%}td.nt .in{min-width:180px}
td.num2,th.num2{width:1%;padding-left:14px}
table.fit{min-width:0}
td button.x{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:16px;padding:4px 8px}
td button.x:hover{color:var(--bad)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.fld .in{color:var(--ink);font-size:15px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 14px;cursor:pointer;min-height:36px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.ac{position:relative}
.aclist{position:absolute;z-index:20;left:0;right:0;top:100%;margin-top:2px;background:var(--surface);border:1px solid var(--accent);border-radius:8px;max-height:260px;overflow:auto;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.aci{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;cursor:pointer}
.aci em{font-style:normal;color:var(--muted);font-size:12px}
.aci.hi{background:color-mix(in srgb,var(--accent) 16%,transparent)}
.pos{color:var(--good)} .neg{color:var(--bad)}
.red{color:var(--bad);font-weight:600}
.tog{display:inline-flex;gap:5px;align-items:center;cursor:pointer}
.tog input{width:18px;height:18px;accent-color:var(--accent)}
textarea.in{min-height:120px;font-family:inherit;width:100%}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
/* screenshot card */
.shot{max-width:760px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.shot h3{font-family:var(--font-display);font-weight:400;font-size:22px;margin:0 0 2px}
.shot .sub{color:var(--muted);font-size:13px;margin-bottom:12px}
.shot .kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:6px 14px;margin-bottom:14px}
.shot .kv div{display:flex;flex-direction:column;gap:1px;border-bottom:1px dashed var(--line);padding:4px 0}
.shot .kv b{font-size:17px}
.shot .kv span{color:var(--muted);font-size:12px;white-space:nowrap}
.ty{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;color:#fff}
.ty.t-실비{background:#c2410c}.ty.t-구인{background:#1c6a65}.ty.t-분배{background:#6d4fc2}.ty.t-뿌리기{background:#2b6cb0}.ty.t-기타{background:#6b7280}
tr.e-실비 td:first-child{box-shadow:inset 4px 0 #c2410c}tr.e-구인 td:first-child{box-shadow:inset 4px 0 #1c6a65}tr.e-분배 td:first-child{box-shadow:inset 4px 0 #6d4fc2}tr.e-뿌리기 td:first-child{box-shadow:inset 4px 0 #2b6cb0}tr.e-기타 td:first-child{box-shadow:inset 4px 0 #6b7280}
tr.e-구인{background:color-mix(in srgb,#1c6a65 8%,transparent)}tr.e-실비{background:color-mix(in srgb,#c2410c 8%,transparent)}tr.e-분배{background:color-mix(in srgb,#6d4fc2 9%,transparent)}
.amt{font-weight:800;font-size:15px}
.rate2{display:flex;align-items:center;gap:4px;margin-top:4px;font-size:12px;color:var(--muted)}
.shot table{min-width:0}
.shot h4{margin:14px 0 4px;font-size:14px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:50;max-width:90vw}
.toast[hidden]{display:none}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:60}
.modal[hidden]{display:none}
.modal .box{background:var(--surface);border-radius:12px;padding:16px;width:min(560px,100%);max-height:90vh;overflow:auto}
body.chk .wrap{visibility:hidden}
body.view .weekbar,body.view #tabs{display:none}
.vbar{background:color-mix(in srgb,var(--accent) 12%,transparent);border:1px solid var(--accent);border-radius:10px;padding:8px 12px;margin-bottom:10px;font-size:13px}
@media (max-width:520px){ .wrap{padding:12px} h1{font-size:22px} .tile b{font-size:16px} }
@media (prefers-reduced-motion:no-preference){ .btn{transition:border-color .12s,background .12s} }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>카쿰 정산기<small>카오스 자쿰 공대 판매 정산</small></h1>
    <div class="weekbar">
      <label class="mgrtop">정산 담당자<input id="mgrTop" class="in" list="dlNames" data-f="settings.manager" data-rr="1" placeholder="예: 표웅식" autocomplete="off"></label>
      <select id="weekSel" class="in" style="width:auto;background:var(--surface);border:1px solid var(--line)" aria-label="회차 선택"></select>
      <button class="btn pri" data-act="newWeek">새 회차</button>
      <button class="btn" id="shareBtn" data-act="shareSnap" hidden>공유 갱신</button>
      <button class="btn danger" data-act="delWeek" data-arm="1">회차 삭제</button>
    </div>
  </header>
  <section id="tiles" class="tiles" aria-live="polite"></section>
  <section id="notes" class="notes"></section>
  <nav id="tabs" class="tabs" role="tablist"></nav>
  <main id="view"></main>
</div>
<datalist id="dlNames"></datalist>
<div id="toast" class="toast" hidden></div>
<div id="modal" class="modal" hidden><div class="box" id="modalBox"></div></div>

<script>
(function(){
'use strict';

// CALC-START
function num(v){
  if(typeof v==='number') return isFinite(v)?v:0;
  const n=Number(String(v==null?'':v).replace(/[,\s원]/g,''));
  return isFinite(n)?n:0;
}
function fmt(n){ return Math.round(num(n)).toLocaleString('en-US'); }
function sum(a,f){ let t=0; for(const x of a) t+=f(x); return t; }
function pct(v){ return Math.max(0,num(v))/100; }
function netOf(r,s){
  const g=Math.round(num(r.qty)*num(r.unit));
  let net=g;
  const ov=(r.fee!==undefined&&r.fee!==null&&String(r.fee).trim()!=='');
  if(ov || r.method!=='상점·직접'){
    const fx=Math.round(num(ov?r.fee:s.fee)*100);
    net=Math.floor((g*(10000-fx)+5000)/10000);
  }
  return {gross:g,net:net};
}
function expenseRows(w,total){
  const s=w.settings, out=[];
  (w.expenses||[]).forEach((e,i)=>{
    let amt=num(e.amount);
    if(e.type==='구인') { const rt=(e.rate!==undefined&&e.rate!==null&&String(e.rate).trim()!=='')?num(e.rate):num(s.recruitRate); amt=Math.floor(num(e.base)*rt/100); }
    out.push({idx:i,auto:false,type:e.type,name:e.name||'',to:String(e.to||'').trim(),amount:amt,note:e.note||''});
  });
  const mgr=String(s.manager||'').trim();
  if(num(s.distRate)>0 && mgr){
    const amt=Math.min(Math.floor(total*num(s.distRate)/100),num(s.distCap));
    out.push({idx:-1,auto:true,type:'분배 인센',name:'분배 인센',to:mgr,amount:amt,
      note:'수수료 후 수익의 '+num(s.distRate)+'%, 상한 '+fmt(s.distCap)});
  }
  return out;
}
function calc(w){
  const s=w.settings;
  const sales=(w.sales||[]).map(r=>Object.assign({},r,netOf(r,s)));
  const rev1=sum(sales.filter(r=>String(r.trt)==='1'),r=>r.net);
  const rev2=sum(sales.filter(r=>String(r.trt)==='2'),r=>r.net);
  const total=rev1+rev2;
  const exps=expenseRows(w,total);
  const expTotal=sum(exps,e=>e.amount);
  const exp1=total>0?expTotal*rev1/total:0;
  const exp2=expTotal-exp1;
  const budget=total-expTotal;
  const pool1=rev1-exp1, pool2=rev2-exp2;
  const att=(w.members||[]).map((m,mi)=>({m:m,mi:mi})).filter(x=>x.m.go && String(x.m.name||'').trim());
  const S1=sum(att,x=>pct(x.m.r1)), S2=sum(att,x=>pct(x.m.r2));
  const unit1=S1>0?pool1/S1:0, unit2=S2>0?pool2/S2:0;
  const expBy={}; exps.forEach(e=>{ if(e.to) expBy[e.to]=(expBy[e.to]||0)+e.amount; });
  const dedBy={}; (w.purchases||[]).forEach(p=>{ const b=String(p.buyer||'').trim(); if(b) dedBy[b]=(dedBy[b]||0)+num(p.amount); });
  const rows=att.map((x,i)=>{
    const m=x.m, name=String(m.name).trim();
    const s1=Math.floor(unit1*pct(m.r1)+1e-6), s2=Math.floor(unit2*pct(m.r2)+1e-6);
    const share=s1+s2, adjust=num(m.adjust), deduct=dedBy[name]||0;
    const real=share+adjust-deduct, exp=expBy[name]||0;
    return {no:i+1,mi:x.mi,extra:false,name:name,job:m.job||'',kind:m.kind||'',r1:num(m.r1),r2:num(m.r2),
      s1:s1,s2:s2,share:share,adjust:adjust,deduct:deduct,real:real,exp:exp,total:real+exp,paid:!!m.paid,p1:0,p2:0};
  });
  const names=new Set(rows.map(r=>r.name));
  Object.keys(Object.assign({},expBy,dedBy)).forEach(n=>{
    if(names.has(n)) return;
    const deduct=dedBy[n]||0, exp=expBy[n]||0;
    if(!deduct && !exp) return;
    rows.push({no:'-',mi:-1,extra:true,name:n,job:'분배 외',kind:'',r1:0,r2:0,s1:0,s2:0,share:0,adjust:0,deduct:deduct,
      real:-deduct,exp:exp,total:exp-deduct,paid:false,p1:0,p2:0});
  });
  const holdings={};
  const mgr=String(s.manager||'').trim();
  sales.forEach(r=>{
    const h=String(r.holder||'').trim()||mgr;
    if(!h||h==='차감정산') return;
    holdings[h]=(holdings[h]||0)+r.net;
  });
  const payer=String(w.payer||'').trim();
  let remain=payer?(holdings[payer]||0):0;
  if(payer && remain>0){
    rows.forEach(r=>{
      if(r.name===payer||r.deduct>0||r.total<=0) return;
      const give=Math.min(r.total,remain); r.p1=give; remain-=give;
    });
    const me=rows.find(r=>r.name===payer);
    if(me && me.total>0){ const give=Math.min(me.total,remain); me.p1=give; remain-=give; }
  }
  rows.forEach(r=>{ r.p2=r.total-r.p1; });
  const distributed=sum(rows,r=>r.share);
  const sumTotal=sum(rows,r=>r.total);
  const paidSum=sum(rows.filter(r=>r.paid),r=>r.total);
  return {sales:sales,rev1:rev1,rev2:rev2,total:total,exps:exps,expTotal:expTotal,exp1:exp1,exp2:exp2,budget:budget,
    pool1:pool1,pool2:pool2,attN:att.length,S1:S1,S2:S2,unit1:unit1,unit2:unit2,rows:rows,distributed:distributed,
    leftover:pool1+pool2-distributed,sumTotal:sumTotal,paidSum:paidSum,holdings:holdings,payer:payer,payerRemain:remain,
    dedTotal:sum(Object.keys(dedBy),k=>dedBy[k])};
}
// CALC-END

/* ---------- state ---------- */
const KEY='cz-settle-v1';
let storageOK=true;
const METHODS=['거래소','직접 교환','상점·직접'];
const KINDS=['공대원','용병'];
const DEFAULT_CATALOG=[
  {n:'확정 투구',m:'직접 교환',g:'투구'},
  {n:'3순위 투구',m:'직접 교환',g:'투구'},
  {n:'알버프+영메 쉐어 판매',m:'상점·직접',g:'쉐어'},
  {n:'[마북] 메이플 용사 30',m:'거래소',g:'마북'},
  {n:'[마북] 메테오 20',m:'거래소',g:'마북'},
  {n:'[마북] 인레이지 20',m:'거래소',g:'마북'},
  {n:'[마북] 베놈 30',m:'거래소',g:'마북'},
  {n:'혼돈의 주문서',m:'거래소',g:'주문서'},
  {n:'투구 지력 주문서 10%',m:'거래소',g:'주문서'},
  {n:'순록의 우유',m:'거래소',g:'소모품'},
  {n:'파워 엘릭서',m:'거래소',g:'소모품'},
  {n:'엘릭서',m:'거래소',g:'소모품'},
  {n:'황혼의 이슬',m:'거래소',g:'소모품'},
  {n:'장비 상점 판매',m:'상점·직접',g:'장비'},
  {n:'메투스',m:'상점·직접',g:'장비',shop:400000},
  {n:'클로니안 엑스',m:'상점·직접',g:'장비',shop:370000},
  {n:'카사 크로우',m:'상점·직접',g:'장비',shop:400000},
  {n:'케이그',m:'상점·직접',g:'장비',shop:310000},
  {n:'코브라스티어',m:'상점·직접',g:'장비',shop:400000},
  {n:'커세어',m:'상점·직접',g:'장비',shop:340000},
  {n:'피나카',m:'상점·직접',g:'장비',shop:490000},
  {n:'레드 크리븐',m:'상점·직접',g:'장비',shop:510000},
  {n:'라 투핸더',m:'상점·직접',g:'장비',shop:400000},
  {n:'다크 샬리트',m:'상점·직접',g:'장비',shop:350000},
  {n:'비펜니스',m:'상점·직접',g:'장비',shop:400000},
  {n:'페어프로즌',m:'상점·직접',g:'장비',shop:370000},
  {n:'프라우테',m:'상점·직접',g:'장비',shop:350000},
  {n:'핼버드',m:'상점·직접',g:'장비',shop:400000},
  {n:'루인해머',m:'상점·직접',g:'장비',shop:400000},
  {n:'배틀해머',m:'상점·직접',g:'장비',shop:470000}
];
function uid(){ return 'w'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

const CHO=['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
function choseong(s){
  return Array.from(s).map(ch=>{ const c=ch.charCodeAt(0); return (c>=0xAC00&&c<=0xD7A3)?CHO[Math.floor((c-0xAC00)/588)]:ch; }).join('');
}
function matchItems(q){
  q=q.trim().toLowerCase().replace(/\s+/g,'');
  if(!q) return S.catalog.slice(0,8);
  const jamo=/^[ㄱ-ㅎ]+$/.test(q);
  const scored=[];
  S.catalog.forEach(it=>{
    const n=it.n.toLowerCase().replace(/\s+/g,'');
    let idx=n.indexOf(q);
    if(idx<0 && jamo) idx=choseong(n).indexOf(q);
    if(idx>=0) scored.push({it:it,idx:idx});
  });
  scored.sort((a,b)=>a.idx-b.idx);
  return scored.slice(0,8).map(x=>x.it);
}

function buildCheck(c){
  const sumNet=sum(c.sales,r=>r.net), sumDist=c.distributed, sumAdj=sum(c.rows,r=>r.adjust), sumDed=sum(c.rows,r=>r.deduct), sumExp=sum(c.rows,r=>r.exp);
  const o=[];
  const add=(l,v,ok,d)=>o.push({l:l,v:v,ok:ok,d:d||''});
  add('판매 수령액 합 = 총 판매',fmt(sumNet),sumNet===c.total,'차이 '+fmt(sumNet-c.total));
  add('경비·인센 합 − 지급 대상 경비',fmt(c.expTotal),sum(c.exps,e=>e.to?e.amount:0)===sumExp,'수령자 미지정 '+fmt(c.expTotal-sumExp));
  add('분배 예산 = 총 판매 − 경비',fmt(c.budget),c.budget===c.total-c.expTotal,'');
  const lo=Math.round(c.leftover);
  add('분배금 합 + 정수 내림 잔액 = 분배 예산',fmt(c.distributed)+' + '+fmt(lo),c.distributed+lo===c.budget && lo>=0 && lo<=Math.max(c.attN*2,1),'잔액 '+fmt(lo));
  add('총 수령액 합 = 분배금 + 조정 − 구매 차감 + 경비',fmt(c.sumTotal),c.sumTotal===c.distributed+sumAdj-sumDed+sumExp,'차이 '+fmt(c.sumTotal-(c.distributed+sumAdj-sumDed+sumExp)));
  add('100% 미만·초과 인원 확인(출발 인원 있음)',c.attN+'명',c.attN>0&&c.S1>0&&c.S2>0,'1트/2트 분배율 합 확인');
  return o;
}

  return '<div class="panel"><div class="row">'+(function(){ const P=buildParts(w,c); return P.length<2?'<button class="btn pri" data-act="copyShot" data-i="0">디스코드용 텍스트 복사</button><span class="hint" style="margin:0">'+P[0].length+'자 · 카드와 같은 내용입니다. 캡처해서 올려도 됩니다.</span>':P.map((x,i)=>'<button class="btn pri" data-act="copyShot" data-i="'+i+'">디스코드용 복사 '+(i+1)+'/'+P.length+'</button>').join('')+'<span class="hint" style="margin:0">디스코드 2000자 제한 때문에 '+P.length+'개로 나눴습니다. 순서대로 붙여넣으세요.</span>'; })()+'</div></div>'+
  '<div class="shot" id="shotCard" style="margin-top:12px"><h3>카오스 자쿰 정산</h3><div class="sub">'+esc(w.label)+' · 출발 '+c.attN+'명</div>'+

const DC_LIMIT=1900;
function dcEsc(v){ return String(v==null?'':v).replace(/([\\*_~`|>#<])/g,'\\$1').replace(/@/g,'@\u200b'); }
function buildParts(w,c){
  const e=dcEsc;
  const head=['**카오스 자쿰 정산** · '+e(w.label)+' · 출발 '+c.attN+'명',
    '총 판매(수수료 후) '+fmt(c.total)+' · 경비·인센 '+fmt(c.expTotal)+' · 분배 예산 '+fmt(c.budget),
    '1트 100%당 '+fmt(Math.floor(c.unit1))+' · 2트 100%당 '+fmt(Math.floor(c.unit2))];
  const sec=[head];
  if(c.sales.length){
    const L=['**판매 내역**'];
    c.sales.forEach(r=>L.push('• '+e(r.item)+(r.note?' ('+e(r.note)+')':'')+' | '+r.trt+'트 | '+e(r.method)+' | ×'+fmt(r.qty)+' | 단가 '+fmt(r.unit)+' | 수령액 '+fmt(r.net)));
    sec.push(L);
  }
  if(c.exps.length){
    const L=['**경비 · 인센**'];
    c.exps.forEach(x=>L.push('• '+e(x.name)+(x.to?' → '+e(x.to):'')+' | '+fmt(x.amount)));
    sec.push(L);
  }
  const ded=(w.purchases||[]).filter(p=>String(p.buyer||'').trim()&&num(p.amount)>0);
  if(ded.length){
    const L=['**투구 구매 차감**'];
    ded.forEach(p=>L.push('• '+e(String(p.buyer).trim())+' | '+fmt(p.amount)));
    sec.push(L);
  }
  const D=['**분배**  (순번 · 닉네임 · 직업 · 분배율 · 실 분배금 · 경비·인센 · 총 수령액)'];
  c.rows.forEach(r=>D.push('• '+r.no+'번 '+e(r.name)+' · '+e(r.job)+' · '+(r.extra?'-':r.r1+'/'+r.r2+'%')+' · '+fmt(r.real)+' · '+fmt(r.exp)+' · **'+fmt(r.total)+'**'));
  sec.push(D);
  // 섹션 단위로 묶고, 길면 줄 단위로 나눔 (디스코드 2000자 제한)
  const parts=[]; let cur=[];
  const len=a=>a.join('\n').length;
  sec.forEach(block=>{
    const txt=block.join('\n');
    if(cur.length && len(cur)+2+txt.length>DC_LIMIT){ parts.push(cur.join('\n\n')); cur=[]; }
    if(txt.length>DC_LIMIT){
      let buf=[];
      block.forEach(line=>{ if(buf.length && buf.join('\n').length+1+line.length>DC_LIMIT){ parts.push(buf.join('\n')); buf=[]; } buf.push(line); });
      if(buf.length) cur.push(buf.join('\n'));
    } else cur.push(txt);
  });
  if(cur.length) parts.push(cur.join('\n\n'));
  return parts;
}
function buildText(w,c){ return buildParts(w,c).join('\n\n'); }

function buildTsv(w,c){
  const t=v=>String(v==null?'':v).replace(/[\t\r\n]+/g,' ');
  const n=v=>Math.round(num(v));
  const L=[];
  L.push(['카오스 자쿰 정산',t(w.label)].join('\t'));
  L.push(['총 판매(수수료 후)',n(c.total),'경비·인센',n(c.expTotal),'분배 예산',n(c.budget),'출발 인원',c.attN,'1트 100%당',Math.floor(c.unit1),'2트 100%당',Math.floor(c.unit2)].join('\t'));
  L.push('','[판매 내역]');
  L.push(['물품','트','방식','수량','단가','판매 총액','수수료 후 수령액','보관자','비고'].join('\t'));
  c.sales.forEach(r=>L.push([t(r.item),r.trt,r.method,n(r.qty),n(r.unit),n(r.gross),n(r.net),t(r.holder),t(r.note)].join('\t')));
  L.push('','[경비·인센]');
  L.push(['항목','수령자','금액','비고'].join('\t'));
  c.exps.forEach(e=>L.push([t(e.name),t(e.to),n(e.amount),t(e.note)].join('\t')));
  const ded=(w.purchases||[]).filter(p=>String(p.buyer||'').trim()&&num(p.amount)>0);
  if(ded.length){ L.push('','[투구 구매 차감]'); L.push(['구매자','금액','비고'].join('\t')); ded.forEach(p=>L.push([t(p.buyer),n(p.amount),t(p.note)].join('\t'))); }
  L.push('','[분배표]');
  L.push(['순번','닉네임','직업','1트 %','2트 %','분배금','조정','구매 차감','실 분배금','경비·인센','총 수령액','1차 지급 (담당자)','2차 지급 (보유자)','지급완료'].join('\t'));
  c.rows.forEach(r=>L.push([r.no,t(r.name),t(r.job),r.r1,r.r2,n(r.share),n(r.adjust),n(r.deduct),n(r.real),n(r.exp),n(r.total),n(r.p2),c.payer?n(r.p1):'',r.paid?'O':''].join('\t')));
  const memo=String(w.memo||'').split('\n').map(x=>x.trim()).filter(Boolean);
  if(memo.length){ L.push('','[메모]'); memo.forEach(x=>L.push(t(x))); }
  return L.join('\n');
}

function bindQE(){
  const it=$('#qItem'), list=$('#acList'); if(!it) return;
  let hi=-1, items=[];
  function paint(){ $$('.aci',list).forEach((d,i)=>d.classList.toggle('hi',i===hi)); }
  function show(){
    items=matchItems(it.value); hi=items.length?0:-1;
    if(!items.length){ list.hidden=true; return; }
    list.innerHTML=items.map((x,i)=>'<div class="aci'+(i===hi?' hi':'')+'" data-ix="'+i+'"><span>'+esc(x.n)+'</span><em>'+(x.last?('지난 입력 '+fmt(x.last)):(num(x.shop)?('상점가 '+fmt(x.shop)):esc(x.m)))+'</em></div>').join('');
    list.hidden=false;
  }
  function pick(i){
    const x=items[i]; if(!x) return;
    it.value=x.n; QE.method=x.m; $('#qMethod').value=x.m; list.hidden=true;
    if(num(x.shop)){ const u=$('#qUnit'); if(!num(u.value)) u.value=fmtIn(num(x.shop)); }
    const q=$('#qQty'); q.focus(); q.select();
  }
  it.addEventListener('input',show);
  it.addEventListener('focus',show);
  it.addEventListener('blur',()=>setTimeout(()=>{list.hidden=true;},120));
  it.addEventListener('keydown',e=>{
    if(list.hidden){ if(e.key==='Enter'){ e.preventDefault(); $('#qQty').focus(); $('#qQty').select(); } return; }
    if(e.key==='ArrowDown'){ hi=Math.min(items.length-1,hi+1); paint(); e.preventDefault(); }
    else if(e.key==='ArrowUp'){ hi=Math.max(0,hi-1); paint(); e.preventDefault(); }
    else if(e.key==='Enter'){ e.preventDefault(); if(hi>=0) pick(hi); }
    else if(e.key==='Escape'){ list.hidden=true; }
  });
  list.addEventListener('mousedown',e=>{ const d=e.target.closest('.aci'); if(d){ e.preventDefault(); pick(+d.dataset.ix); } });
  $('#qMethod').addEventListener('change',e=>{ QE.method=e.target.value; });
  $('#qHolder').addEventListener('input',e=>{ QE.holder=e.target.value; });
  const fmtOnBlur=el=>el.addEventListener('blur',()=>{ if(el.value!=='') el.value=fmtIn(num(el.value)); });
  fmtOnBlur($('#qQty')); fmtOnBlur($('#qUnit'));
  $('#qQty').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); $('#qUnit').focus(); $('#qUnit').select(); } });
  $('#qUnit').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); addSale(); } });
}
function addEquip(){
  const w=cur(), inp=$('#eqIn'); if(!inp) return;
  const nm=t=>String(t||'').replace(/\s+/g,'');
  const names=inp.value.split(/[\/,·\n]+/).map(x=>x.trim()).filter(Boolean);
  if(!names.length){ toast('장비 이름을 입력하세요.'); inp.focus(); return; }
  const found=[], bad=[];
  names.forEach(n=>{ const it=S.catalog.find(x=>nm(x.n)===nm(n)); if(it && num(it.shop)>0) found.push(it); else bad.push(n); });
  if(bad.length){ toast('상점가를 모르는 장비: '+bad.join(', ')); return; }
  const total=found.reduce((a,x)=>a+num(x.shop),0);
  w.sales.push({item:'장비 상점 판매',trt:$('#eqTrt').value,method:'상점·직접',qty:1,unit:total,holder:'',note:found.map(x=>x.n).join(', ')});
  save(); renderHead(); renderTab(); toast('장비 '+found.length+'개 '+fmt(total)+' 메소를 추가했습니다.');
}
function addSale(){
  const w=cur(), it=$('#qItem'); if(!it) return;
  const name=it.value.trim(), qty=num($('#qQty').value), unit=num($('#qUnit').value);
  if(!name){ toast('물품 이름을 입력하세요.'); it.focus(); return; }
  if(qty<=0){ toast('수량을 입력하세요.'); $('#qQty').focus(); return; }
  if(unit<=0){ toast('단가를 입력하세요.'); $('#qUnit').focus(); return; }
  const method=$('#qMethod').value;
  let hv=($('#qHolder').value||'').trim(); if(hv===String(w.settings.manager||'').trim()) hv='';
  w.sales.push({item:name,trt:QE.trt,method:method,qty:qty,unit:unit,holder:hv,note:''});
  let ci=S.catalog.find(x=>x.n===name);
  if(!ci){ ci={n:name,m:method,last:0}; S.catalog.push(ci); }
  ci.last=unit;
  save(); renderHead(); renderTab();
  const n=$('#qItem'); if(n) n.focus();
  toast('추가: '+name);
}

const armed=new WeakMap();
function armGuard(btn){
  if(!btn.dataset.arm) return true;
  if(armed.get(btn)){ clearTimeout(armed.get(btn).t); armed.delete(btn); btn.classList.remove('armed'); btn.textContent=btn.dataset.label; return true; }
  btn.dataset.label=btn.textContent; btn.textContent='한 번 더 누르면 실행'; btn.classList.add('armed');
  armed.set(btn,{t:setTimeout(()=>{ btn.classList.remove('armed'); btn.textContent=btn.dataset.label; armed.delete(btn); },3000)});
  return false;
}
function parseCatalog(text){
  const old={}, oldg={}; S.catalog.forEach(x=>{ old[x.n]=x.last||0; oldg[x.n]=x.g||''; });
  const out=[];
  text.split('\n').forEach(line=>{
    const p=line.split('|'); const n=p[0].trim(); if(!n) return;
    const mt=(p[1]||'').trim(); const m=/교환/.test(mt)?'직접 교환':(/상점|직접/.test(mt)?'상점·직접':'거래소');
    const it={n:n,m:m,last:old[n]||0}; const sp=num(String(p[2]||'').replace(/[^0-9.]/g,'')); if(sp>0) it.shop=sp; if(oldg[n]) it.g=oldg[n]; out.push(it);
  });
  return out;
}

}

      break;
    case 'bulkApply':{
      const lines=($('#bulkTa').value||'').split('\n');
      let n=0;
      lines.forEach(l=>{ const p=l.split(/[,\t]/).map(x=>x.trim()); if(!p[0]) return; w.members.push(newMember(p[0],p[1]||'',p[2]==='용병'?'용병':'공대원')); n++; });
      closeModal(); save(); renderHead(); renderTab(); toast(n+'명을 추가했습니다.'); break; }
    case 'closeModal': closeModal(); break;
    case 'qTrt': QE.trt=b.dataset.v; $$('#qTrt button').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.v===QE.trt))); break;
    case 'addSale': addSale(); break;
    case 'addEquip': addEquip(); break;
    case 'delSale': w.sales.splice(i,1); save(); renderHead(); renderTab(); break;
    case 'addExp':{
      const t=b.dataset.v;
      w.expenses.push({type:t,name:t==='구인'?'구인 인센':'',to:'',amount:0,base:t==='구인'?num(w.settings.recruitBase):0,note:''});
      save(); renderHead(); renderTab(); break; }
    case 'delExp': w.expenses.splice(i,1); save(); renderHead(); renderTab(); break;
    case 'addPur': w.purchases.push({buyer:'',amount:0,note:''}); save(); renderHead(); renderTab(); break;
    case 'delPur': w.purchases.splice(i,1); save(); renderHead(); renderTab(); break;
    case 'copyShot': { const P=buildParts(w,calc(w)); const i=Math.min(P.length-1,+(b.dataset.i||0)); copyText(P[i],P.length>1?('디스코드용 텍스트 '+(i+1)+'/'+P.length+'을 복사했습니다.'):'디스코드용 텍스트를 복사했습니다.'); break; }
    case 'saveCat': S.catalog=parseCatalog($('#catTa').value); save(); toast('물품 목록 '+S.catalog.length+'개를 적용했습니다.'); break;
    case 'resetCat': S.catalog=DEFAULT_CATALOG.map(x=>Object.assign({last:0},x)); save(); renderTab(); toast('기본 목록으로 되돌렸습니다.'); break;
    case 'copyTsv': copyText(buildTsv(w,calc(w)),'시트용 표를 복사했습니다. 구글 시트 칸에 붙여넣으세요.'); break;
    case 'backup': copyText(JSON.stringify(S),'백업을 복사했습니다. 메모장 등에 붙여넣어 보관하세요.'); break;
    case 'restoreBox':
      openModal('<h2>붙여넣어 복원</h2><p class="hint">복사해 둔 백업 내용을 붙여넣으세요. 현재 데이터는 덮어쓰기됩니다.</p><textarea class="in" id="restoreTa"></textarea><div class="row" style="margin-top:10px"><button class="btn pri" data-act="restoreApply">복원</button><button class="btn" data-act="closeModal">취소</button></div>');
      break;
    case 'restoreApply': if(importState($('#restoreTa').value)) closeModal(); break;
    case 'wipe':{
      const nw=blankWeek(todayLabel()+' 회차',null);
      S={v:1,cur:nw.id,weeks:[nw],seedsDone:[SEED_ID],catalog:DEFAULT_CATALOG.map(x=>Object.assign({last:0},x))};
      save(); render(); toast('초기화했습니다.'); break; }
  }
});
function onField(e){
  const t=e.target; if(!t.dataset||!t.dataset.f) return;
  const w=cur(); let v;
  if(t.type==='checkbox') v=t.checked;
  else if(t.dataset.t==='feeov') v=String(t.value).trim()===''?'':num(t.value);
  else if(t.dataset.t==='num') v=num(t.value);
  else v=t.value;
  if(/^sales\.\d+\.holder$/.test(t.dataset.f) && String(v).trim()===String(w.settings.manager||'').trim()) v='';
  setPath(w,t.dataset.f,v);
  save();
  if(t.dataset.rr && (e.type==='change')){ renderHead(); renderTab(); } else refreshLive();
  if(t.dataset.f==='label'){ const o=$('#weekSel option[value="'+w.id+'"]'); if(o) o.textContent=v; }
}
document.addEventListener('input',onField);
document.addEventListener('change',onField);
document.addEventListener('focusout',e=>{ const t=e.target; if(t.dataset && t.dataset.t==='num') t.value=fmtIn(num(t.value)); });
document.addEventListener('change',e=>{
  if(e.target.id==='weekSel'){ S.cur=e.target.value; save(); render(); }
  if(e.target.id==='fileIn' && e.target.files[0]){
    const fr=new FileReader(); fr.onload=()=>importState(String(fr.result)); fr.readAsText(e.target.files[0]);
  }
});
$('#modal').addEventListener('mousedown',e=>{ if(e.target.id==='modal') closeModal(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });

render();
(async function shareInit(){
  if(typeof claude==='undefined' || !claude.use) return;
  document.body.classList.add('chk');
  const done=()=>document.body.classList.remove('chk');
  const tm=setTimeout(done,3500);
  try{
    const user=await claude.use('user'), db=await claude.use('db');
    if(!db){ done(); return; }
    const owner=!!(user && user.isOwner && user.isOwner());
    if(owner){ SHDB=db; const b=$('#shareBtn'); if(b) b.hidden=false; done(); return; }
    db.doc('share/current').onSnapshot(snap=>{
      clearTimeout(tm);
      const d=snap && (typeof snap.data==='function'?snap.data():snap);
      if(d && d.week){ try{ VIEW=JSON.parse(d.week); VMETA={at:d.at}; }catch(e){ VIEW=null; } }
      if(VIEW){ render(); }
      else { document.body.classList.add('view'); $('#view').innerHTML='<div class="vbar">아직 공유된 정산이 없습니다.</div>'; }
      done();
    },()=>done());
  }catch(e){ done(); }
})();
})();
</script>
